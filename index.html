<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/styles.css">
    <title>SkillMap Zimbabwe - Dashboard</title>
</head>
<body>
    <div class="dashboard">

        <!-- NAV BAR -->
        <nav class="navbar">
            <div class="logo">
                <img src="logo-icon.png" alt="SkillMap Zimbabwe Logo" class="logo-icon" />
                <div class="logo-text">SkillMap <span>ZW</span></div>
            </div>
            <input class="nav-search" placeholder="🔍 Search skills, sectors, regions..." />
            <div class="nav-profile">
                <span>Bruce</span>
                <div class="avatar">B</div>
            </div>
        </nav>

        <!-- KPI ROW -->
        <div class="kpi-row">
            <div class="kpi-card">
                <div class="kpi-label">Total Skills Mapped</div>
                <span class="kpi-number" id="kpi1">--</span>
                <span class="kpi-change">↑ Loading...</span>
            </div>
            <div class="kpi-card">
                <div class="kpi-label">Sectors Covered</div>
                <span class="kpi-number" id="kpi2">--</span>
                <span class="kpi-change">↑ Loading...</span>
            </div>
            <div class="kpi-card">
                <div class="kpi-label">Overall Skills Gap</div>
                <span class="kpi-number" id="kpi3">--</span>
                <span class="kpi-change down">↓ Loading...</span>
            </div>
            <div class="kpi-card">
                <div class="kpi-label">Training Ready</div>
                <span class="kpi-number" id="kpi4">--</span>
                <span class="kpi-change">↑ Loading...</span>
            </div>
        </div>

        <!-- MAIN GRID -->
        <div class="main-grid">
            <div class="chart-card">
                <div class="chart-title">📊 Skills Supply vs Demand by Sector</div>
                <div class="chart-container" style="position: relative; height: 300px; width: 100%;">
                    <canvas id="supplyDemandChart"></canvas>
                </div>
                <div style="display:flex; gap:20px; margin-top:14px; font-size:12px; color:#4A4A4A; justify-content:center; flex-wrap:wrap;">
                    <span>■ <span style="color:#16666A; font-weight:600;">Demand</span></span>
                    <span>■ <span style="color:#CAA84F; font-weight:600;">Supply</span></span>
                    <span style="opacity:0.6;">Data source: ZIMCHE / POTRAZ 2026</span>
                </div>
            </div>
            
            <div class="filters-card">
                <div class="filters-title">🔍 Filters</div>
                <div class="filter-group">
                    <label class="filter-label">Region</label>
                    <select class="filter-select" id="regionSelect">
                        <option value="All Regions">All Regions</option>
                        <!-- Populated from JSON -->
                    </select>
                </div>
                <div class="filter-group">
                    <label class="filter-label">Sector</label>
                    <select class="filter-select" id="sectorSelect">
                        <option value="All Sectors">All Sectors</option>
                        <!-- Populated from JSON -->
                    </select>
                </div>
                <div class="filter-group">
                    <label class="filter-label">Year</label>
                    <select class="filter-select" id="yearSelect">
                        <option value="2026">2026</option>
                        <option value="2025">2025</option>
                        <option value="2024">2024</option>
                    </select>
                </div>
                <div class="filter-group">
                    <label class="filter-label">Skill Level</label>
                    <select class="filter-select" id="levelSelect">
                        <option value="All Levels">All Levels</option>
                        <option value="Entry">Entry</option>
                        <option value="Intermediate">Intermediate</option>
                        <option value="Expert">Expert</option>
                    </select>
                </div>
                <button class="btn-apply" id="applyFilters">Apply Filters</button>
            </div>
        </div>

        <!-- INSIGHTS (Dynamic) -->
        <div class="insights-row">
            <!-- Built dynamically from JSON -->
        </div>

        <!-- ACTIONS (Dynamic) -->
        <div class="actions-card">
            <!-- Built dynamically from JSON -->
        </div>

    </div>

    <!-- Chart.js CDN -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <!-- Dashboard JS -->
    <script src="js/dashboard.js"></script>
</body>
</html>
